name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Type-check, lint, test, build (Node 22)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine3.20
        env:
          POSTGRES_USER: amdox
          POSTGRES_PASSWORD: amdox_test
          POSTGRES_DB: amdox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amdox -d amdox_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Test-only values; never used outside CI.
      DATABASE_URL: postgresql://amdox:amdox_test@localhost:5432/amdox_test
      TEST_DATABASE_URL: postgresql://amdox:amdox_test@localhost:5432/amdox_test
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdefghijklmnop
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdefghijklmno
      ML_INTERNAL_TOKEN: ci-ml-internal-token-0123
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prisma validate + generate
        run: |
          pnpm --filter api exec prisma validate
          pnpm --filter api exec prisma generate

      - name: Apply migrations to the CI database
        run: pnpm --filter api exec prisma migrate deploy

      - name: Check for schema drift (schema.prisma vs migrations)
        run: pnpm --filter api exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Type-check every package (types, api incl. seed, web)
        run: pnpm turbo run check-types

      - name: Lint
        run: pnpm turbo run lint

      - name: Test (unit + integration against Postgres)
        run: pnpm turbo run test

      - name: Seed runs against a migrated database
        run: pnpm --filter api run db:seed

      - name: Build
        run: pnpm turbo run build

  ml:
    name: ML service tests (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/ml-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [node, ml]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        env:
          POSTGRES_PASSWORD: ci-only
          JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdefghijklmnop
          JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdefghijklmno
          ML_INTERNAL_TOKEN: ci-ml-internal-token-0123
        run: docker compose --profile app build
