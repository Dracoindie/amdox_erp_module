# TEMPLATE ONLY - never commit real values. Not referenced by kustomization.yaml.
# Create the real Secret out of band, for example:
#   kubectl -n amdox-production create secret generic amdox-erp-secrets \
#     --from-literal=DATABASE_URL='postgresql://USER:PASS@HOST:5432/amdox_erp?sslmode=require' \
#     --from-literal=JWT_ACCESS_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=JWT_REFRESH_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=ML_INTERNAL_TOKEN="$(openssl rand -base64 32)"
# or manage it with Sealed Secrets / External Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: amdox-erp-secrets
  namespace: amdox-production
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/amdox_erp?sslmode=require"
  JWT_ACCESS_SECRET: "REPLACE_WITH_48_RANDOM_BYTES"
  JWT_REFRESH_SECRET: "REPLACE_WITH_DIFFERENT_48_RANDOM_BYTES"
  ML_INTERNAL_TOKEN: "REPLACE_WITH_32_RANDOM_BYTES"
