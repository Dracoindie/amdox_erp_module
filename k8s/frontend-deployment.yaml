apiVersion: apps/v1
kind: Deployment
metadata:
  name: amdox-erp-frontend
  namespace: amdox-production
  labels: { app: amdox-erp-frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: amdox-erp-frontend }
  template:
    metadata:
      labels: { app: amdox-erp-frontend }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          # Build with --build-arg NEXT_PUBLIC_API_URL=https://api.erp.example.com
          image: amdox-erp-suite/web:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: next-cache, mountPath: /app/apps/web/.next/cache }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          livenessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - { name: next-cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
